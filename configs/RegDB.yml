prefix: RegDB

fp16: true
rerank: false

# dataset
sample_method: identity_random
image_size: (288, 144)
p_size: 4 #原4
k_size: 8

dataset: regdb

# loss
classification: true
center_cluster: true
triplet: false
center: false

# parameters
# pattern attention
num_parts: 7
weight_sep: 0.5
# mutual learning
update_rate: 0.2
weight_sid: 0.5
weight_KL: 2.5

# architecture
drop_last_stride: true
pattern_attention: true
mutual_learning: true
modality_attention: 2 #原0

# optimizer
lr: 0.001 #原0.00035，0.001做迁移学习效果好配合解冻层
optimizer: adam
num_epoch: 160
lr_step: [20, 40]

# augmentation
random_flip: true
random_crop: true
random_erase: true
color_jitter: false
padding: 10

# log
log_period: 10
start_eval: 1
eval_interval: 2
